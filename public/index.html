<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mistral Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f4f4f9; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1a1a2e; color: #fff; padding: 14px 20px; font-weight: 600; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: #ffbc42; color: #1a1a2e; }
    .assistant { align-self: flex-start; background: #fff; border: 1px solid #ddd; }
    .error { align-self: center; color: #b00020; font-size: 0.9em; }
    form { display: flex; gap: 8px; padding: 12px 20px; background: #fff; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 10px; font-size: 1em; }
    button { padding: 10px 18px; border: none; border-radius: 10px; background: #1a1a2e; color: #fff; font-size: 1em; cursor: pointer; }
    button:disabled { background: #888; cursor: wait; }
  </style>
</head>
<body>
  <header>Mistral Chat (mistral-small-latest)</header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Stel een vraag..." autocomplete="off" required />
    <button id="send" type="submit">Verstuur</button>
  </form>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const history = [];

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMsg(message, "user");
      input.value = "";
      send.disabled = true;
      const pending = addMsg("...", "assistant");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        const data = await res.json();
        pending.remove();
        if (!res.ok) {
          addMsg(data.error || "Er ging iets mis.", "error");
        } else {
          addMsg(data.reply, "assistant");
          history.push({ role: "user", content: message });
          history.push({ role: "assistant", content: data.reply });
        }
      } catch {
        pending.remove();
        addMsg("Kon de server niet bereiken.", "error");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
